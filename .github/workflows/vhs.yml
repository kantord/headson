name: Demo Tape Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  demo-tape:
    name: Replay demo.tape
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charmbracelet/vhs:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run VHS tape
        working-directory: docs/tapes
        run: vhs demo.tape
